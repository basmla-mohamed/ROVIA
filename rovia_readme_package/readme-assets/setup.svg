<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#32131F"/><stop offset="100%" stop-color="#782A43"/>
</linearGradient></defs>
<rect x="8" y="8" width="1184" height="284" rx="28" fill="url(#g)" stroke="#F0C58B" stroke-width="3"/>
<circle cx="1120" cy="58" r="110" fill="#F0C58B" opacity=".06"/>
<text x="58" y="70" fill="#F0C58B" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2">RUN LOCALLY</text>
<path d="M58 91 H250" stroke="#F0C58B" stroke-width="4" stroke-linecap="round"/>
<text x="62" y="128" fill="#FAF7F6" font-family="Arial, sans-serif" font-size="22">1. Clone your repository</text>
<text x="62" y="162" fill="#FAF7F6" font-family="Arial, sans-serif" font-size="22">2. Run: npm install</text>
